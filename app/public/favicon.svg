<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Borderless Cedar glyph; adapts to the browser chrome via prefers-color-scheme.
       A monitor on a timber desk. -->
  <style>
    .fg { stroke: #1f513f; }
    .stand { fill: #1f513f; }
    .desk { fill: #8b5a2b; }
    .glow { fill: #b8860b; }
    @media (prefers-color-scheme: dark) {
      .fg { stroke: #f4f2ed; }
      .stand { fill: #f4f2ed; }
      .desk { fill: #c08552; }
      .glow { fill: #d89f28; }
    }
  </style>
  <rect class="fg" x="12" y="7" width="40" height="27" rx="4" stroke-width="5"/>
  <rect class="glow" x="20" y="16" width="14" height="4.5" rx="2.25"/>
  <rect class="stand" x="28.5" y="34" width="7" height="10"/>
  <rect class="desk" x="4" y="44" width="56" height="7" rx="3.5"/>
  <rect class="stand" x="9" y="51" width="5" height="10" rx="2"/>
  <rect class="stand" x="50" y="51" width="5" height="10" rx="2"/>
</svg>
